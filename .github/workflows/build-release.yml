name: Build Sagaa macOS App & Release DMG

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build & Package DMG
        run: |
          chmod +x build.sh
          ./build.sh --dmg
          cd dist
          shasum -a 256 Sagaa-macOS.dmg > Sagaa-macOS.dmg.sha256
          echo "### Release Checksum" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat Sagaa-macOS.dmg.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sagaa-Installer-DMG
          path: |
            dist/Sagaa-macOS.dmg
            dist/Sagaa-macOS.dmg.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sagaa-macOS.dmg
            dist/Sagaa-macOS.dmg.sha256
          generate_release_notes: true
